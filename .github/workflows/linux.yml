name: Linux integration build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CTEST_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned upstream
        id: source
        run: echo "sha=$(python3 -c 'import json; print(json.load(open("sources.json"))["orca"]["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: ${{ steps.source.outputs.sha }}
          path: source
      - name: Apply downstream patches
        shell: bash
        run: |
          shopt -s nullglob
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            git -C source apply --check "$patch"
            git -C source apply "$patch"
          done
      - name: Record packaged source provenance
        run: python3 scripts/write-build-manifest.py source
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~4.3.0'
      - name: Install build packages
        working-directory: source
        run: |
          ./build_linux.sh -u
          sudo apt-get install -y ccache xvfb
      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: source/deps/build
          key: qidi-linux-deps-${{ steps.source.outputs.sha }}
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: qidi-ccache-${{ steps.source.outputs.sha }}-${{ github.sha }}
          restore-keys: qidi-ccache-${{ steps.source.outputs.sha }}-
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: source
        run: |
          set -o pipefail
          ./build_linux.sh -drlL -j 2 2>&1 | tee ../dependencies.log
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: source/deps/build
          key: qidi-linux-deps-${{ steps.source.outputs.sha }}
      - name: Build slicer and tests
        id: build
        working-directory: source
        run: |
          set -o pipefail
          ./build_linux.sh -sitrlL -j 2 2>&1 | tee ../compile.log
          shopt -s nullglob
          images=(build/*.AppImage)
          test "${#images[@]}" -eq 1
          test -s "${images[0]}"
      - name: Unit tests
        working-directory: source
        run: timeout 45m xvfb-run -a ./scripts/run_unit_tests.sh build/tests Release
      - name: Upstream CLI regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: source
        run: xvfb-run -a ctest --test-dir build/tests -C Release -L RequiresApp --no-tests=error --output-on-failure --timeout 300
      - name: Profile structure checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: source
        run: python3 scripts/orca_profile_tool.py check
      - name: MAX4 offline slicing and persistence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a python3 scripts/validate-max4-slicing.py --source source
      - name: Retain build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-integration-${{ github.sha }}
          path: |
            source/build/*.AppImage
            source/build/Testing/Temporary/*.log
            source/build/tests/Testing/Temporary/*.log
            source/ctest_results.xml
            source/build/CMakeFiles/CMakeConfigureLog.yaml
            dependencies.log
            compile.log
            build/max4-slicing/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: qidi-ccache-${{ steps.source.outputs.sha }}-${{ github.sha }}
